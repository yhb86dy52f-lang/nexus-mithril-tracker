<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUNEFORGE // ANDURIL-HUBBLE</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css"/>
    <style>
        :root { --bg-dark: #050508; --bg-panel: rgba(15, 5, 25, 0.85); --neon-green: #00ff66; --neon-cyan: #00e5ff; --neon-red: #ff0055; --neon-orange: #ffaa00; --neon-purple: #d400ff; --text-main: #e0e0e0; --text-muted: #6b7280; --border-glow: rgba(0, 229, 255, 0.2); }
        * { box-sizing: border-box; font-family: 'JetBrains Mono', monospace; }
        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg-dark); color: var(--text-main); overflow: hidden; }
        body::before { content: ''; position: absolute; inset: 0; z-index: -1; background-image: linear-gradient(rgba(0, 229, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 229, 255, 0.03) 1px, transparent 1px); background-size: 30px 30px; pointer-events: none; }
        #app { display: flex; flex-direction: column; height: 100vh; width: 100vw; }
        
        .header { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid var(--border-glow); background: rgba(5, 5, 8, 0.9); backdrop-filter: blur(10px); z-index: 1000; }
        .logo-area { display: flex; align-items: center; gap: 15px; }
        .logo-box { background: var(--neon-cyan); color: #000; font-weight: 900; padding: 6px 12px; font-size: 16px; border-radius: 4px; box-shadow: 0 0 15px rgba(0, 229, 255, 0.4); }
        .logo-text { font-size: 18px; font-family: 'Rajdhani', sans-serif; font-weight: 700; letter-spacing: 2px; }
        .logo-text span { color: var(--neon-cyan); }
        
        .nav-toggle { display: flex; gap: 10px; }
        .nav-btn { background: rgba(0, 0, 0, 0.5); border: 1px solid var(--text-muted); color: var(--text-muted); padding: 8px 16px; font-size: 11px; font-weight: bold; cursor: pointer; border-radius: 4px; transition: all 0.3s; letter-spacing: 1px; }
        .nav-btn:hover { border-color: var(--neon-cyan); color: var(--neon-cyan); }
        .nav-btn.active { background: rgba(0, 229, 255, 0.1); border-color: var(--neon-cyan); color: var(--neon-cyan); box-shadow: 0 0 10px rgba(0, 229, 255, 0.2); }
        .btn-shutdown { border-color: var(--neon-red); color: var(--neon-red); }
        .btn-shutdown:hover { background: rgba(255, 0, 85, 0.2); border-color: var(--neon-red); color: #fff; }

        .main-content { display: flex; flex: 1; overflow: hidden; position: relative; }
        #view-map { display: flex; flex: 1; width: 100%; height: 100%; }
        
        .sidebar { background: var(--bg-panel); backdrop-filter: blur(10px); display: flex; flex-direction: column; overflow: hidden; width: 320px; border-right: 1px solid var(--border-glow); }
        .panel-header { padding: 15px; font-size: 11px; letter-spacing: 2px; color: var(--text-muted); border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; }
        .panel-header span { color: var(--neon-cyan); font-weight: bold; }
        
        #device-list { flex: 1; overflow-y: auto; padding: 10px; }
        .device-item { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 6px; padding: 12px; margin-bottom: 10px; cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column; gap: 6px; }
        .device-item:hover { background: rgba(0, 229, 255, 0.05); border-color: var(--neon-cyan); transform: translateX(4px); }
        .device-item.active { background: rgba(0, 229, 255, 0.1); border-color: var(--neon-cyan); box-shadow: inset 0 0 15px rgba(0, 229, 255, 0.1); }
        
        .dev-title { display: flex; justify-content: space-between; font-family: 'Rajdhani', sans-serif; font-size: 15px; font-weight: 700; color: #fff; }
        .dev-title.online { color: var(--neon-green); text-shadow: 0 0 8px rgba(0, 255, 102, 0.4); }
        .dev-coords { display: flex; justify-content: space-between; font-size: 10px; color: var(--neon-cyan); }
        .dev-stats { display: flex; gap: 10px; font-size: 9px; color: var(--text-muted); margin-top: 4px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 6px; }

        #map-container { flex: 1; position: relative; background: #000; }
        #map { width: 100%; height: 100%; z-index: 1; }
        .leaflet-layer { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(110%) sepia(20%); }
        
        .map-reticle { position: absolute; top: 50%; left: 50%; width: 200px; height: 200px; transform: translate(-50%, -50%); border: 1px solid rgba(0, 229, 255, 0.1); border-radius: 50%; pointer-events: none; z-index: 400; display: flex; align-items: center; justify-content: center; }
        .map-reticle::before, .map-reticle::after { content: ''; position: absolute; background: rgba(0, 229, 255, 0.2); }
        .map-reticle::before { width: 100%; height: 1px; }
        .map-reticle::after { width: 1px; height: 100%; }

        .info-panel { width: 0; overflow: hidden; transition: width 0.3s ease; background: var(--bg-panel); backdrop-filter: blur(10px); border-left: 1px solid var(--border-glow); display: flex; flex-direction: column; }
        .info-panel.open { width: 340px; }
        .info-content { padding: 20px; display: flex; flex-direction: column; gap: 15px; height: 100%; overflow-y: auto; }
        
        .stat-box { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 6px; }
        .stat-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .stat-value { font-family: 'Rajdhani', sans-serif; font-size: 20px; font-weight: 700; color: var(--neon-cyan); }

        #view-vault { display: none; flex: 1; width: 100%; height: 100%; padding: 20px; overflow-y: auto; flex-direction: column; background: rgba(5, 5, 8, 0.95); }
        .vault-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--neon-cyan); padding-bottom: 15px; }
        
        .kanban-board { display: flex; gap: 15px; flex: 1; overflow-x: auto; align-items: flex-start; padding-bottom: 20px; }
        .kanban-col { flex: 1; min-width: 300px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 8px; display: flex; flex-direction: column; max-height: 100%; }
        .kanban-header { padding: 12px; font-weight: bold; font-size: 12px; letter-spacing: 1px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); border-top-left-radius: 8px; border-top-right-radius: 8px; }
        .kanban-body { padding: 10px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 8px; }
        
        .sms-card { background: rgba(0,0,0,0.5); border-left: 3px solid var(--neon-cyan); padding: 10px; border-radius: 4px; font-size: 10px; color: #aaa; line-height: 1.5; word-break: break-all; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .sms-time { font-size: 9px; color: var(--text-muted); margin-bottom: 6px; display: block; border-bottom: 1px dashed rgba(255,255,255,0.1); padding-bottom: 4px; }

        .btn-action { background: transparent; border: 1px solid var(--neon-cyan); color: var(--neon-cyan); padding: 8px 16px; font-size: 11px; font-weight: bold; cursor: pointer; border-radius: 4px; transition: all 0.2s; letter-spacing: 1px; text-transform: uppercase; }
        .btn-action:hover { background: rgba(0, 229, 255, 0.1); box-shadow: 0 0 10px rgba(0, 229, 255, 0.3); }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 229, 255, 0.3); border-radius: 4px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .live-dot { display: inline-block; width: 8px; height: 8px; background: var(--neon-green); border-radius: 50%; box-shadow: 0 0 8px var(--neon-green); animation: blink 1.5s infinite; }
            @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .alert-box {
            background: rgba(255, 0, 85, 0.95);
            border: 1px solid #ff0055;
            color: white;
            padding: 15px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.6);
            animation: slideIn 0.3s ease-out;
            min-width: 250px;
        }
    </style>
</head>
<body>
<div id="app">
    <header class="header">
        <div class="logo-area">
            <div class="logo-box">AH</div>
            <div class="logo-text">ANDURIL <span>//</span> HUBBLE</div>
        </div>
        
        <div class="nav-toggle">
            <button class="nav-btn active" id="btn-view-map" onclick="switchView('map')">MAPA TÁCTICO</button>
            <button class="nav-btn" id="btn-view-vault" onclick="switchView('vault')">BÓVEDA DE DATOS</button>
            <button class="nav-btn btn-shutdown" onclick="shutdownSystem()">⏻ APAGAR SISTEMA</button>
        </div>

        <div style="display:flex; gap:20px; align-items:center; font-size:11px;">
            <div style="display:flex; align-items:center; gap:8px; background:rgba(0,0,0,0.4); border:1px solid rgba(255,255,255,0.1); padding:6px 12px; border-radius:4px;">
                <span class="live-dot"></span> 
                <span style="color:var(--neon-green); font-weight:bold;" id="api-status">SYSTEM ONLINE</span>
            </div>
            <div id="clock" style="color:var(--neon-cyan); font-weight:bold; letter-spacing:1px;">00:00:00</div>
        </div>
    </header>

    <main class="main-content">
        <div id="view-map">
            <aside class="sidebar">
                <div class="panel-header">
                    <span>FLOTA REGISTRADA // <span id="kpi-total">0</span></span>
                    <span style="color:var(--neon-green);"><span id="kpi-online">0</span> ACTIVOS</span>
                </div>
                <div id="device-list"></div>
            </aside>
            
            <div id="alert-container" style="position:absolute; top:20px; right:20px; z-index:9999; display:flex; flex-direction:column; gap:10px;"></div>`r`n            <div id="map-container">
                <div class="map-reticle"></div>
                <div id="map"></div>
            </div>

            <aside class="info-panel" id="info-panel">
                <div class="info-content" id="info-content">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                        <h2 style="margin:0; color:var(--neon-cyan); font-family:'Rajdhani'; font-size:22px;" id="info-title">UNIDAD</h2>
                        <button onclick="closePanel()" style="background:none; border:none; color:var(--neon-red); cursor:pointer; font-size:16px; font-weight:bold;">✖</button>
                    </div>
                    <div id="info-data" style="display:flex; flex-direction:column; gap:12px;"></div>
                </div>
            </aside>
        </div>

        <div id="view-vault">
            <div class="vault-header">
                <div>
                    <h2 style="margin:0 0 5px 0; font-size:20px; color:var(--neon-cyan); font-family:'Rajdhani'; letter-spacing:1px;">📥 BÓVEDA DE CLASIFICACIÓN</h2>
                    <span style="font-size:12px; color:var(--text-muted);">Clasificación automática (Galton Board)</span>
                </div>
                <button class="btn-action" onclick="exportVault()">📥 EXPORTAR CSV</button>
            </div>
            <div class="kanban-board" id="vault-grid"></div>
        </div>
    </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
<script src="https://unpkg.com/supercluster@6.0.2/dist/supercluster.min.js"></script>
<script>
    const API = window.location.origin;
    const HEADERS = { 'x-api-key': 'RF-NEXUS-SECURE-2026' };
    let allPositions = [], dispositivos = [], currentFiltered = [], scIndex = null;

    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString() + ' MX'; }, 1000);

    function switchView(view) {
        if (view === 'map') {
            document.getElementById('view-map').style.display = 'flex';
            document.getElementById('view-vault').style.display = 'none';
            document.getElementById('btn-view-map').classList.add('active');
            document.getElementById('btn-view-vault').classList.remove('active');
            map.invalidateSize();
        } else {
            document.getElementById('view-map').style.display = 'none';
            document.getElementById('view-vault').style.display = 'flex';
            document.getElementById('btn-view-map').classList.remove('active');
            document.getElementById('btn-view-vault').classList.add('active');
            loadVault();
        }
    }

    async function shutdownSystem() {
        if (!confirm('¿Estás seguro de que deseas APAGAR el servidor?')) return;
        try {
            document.getElementById('api-status').innerText = 'APAGANDO...';
            document.getElementById('api-status').style.color = 'var(--neon-red)';
            await fetch(`${API}/api/system/shutdown`, { method: 'POST', headers: HEADERS });
            setTimeout(() => {
                document.body.innerHTML = '<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; background:#050508; color:#ff0055; font-family:monospace;"><h1 style="font-size:40px; text-shadow:0 0 20px #ff0055;">SISTEMA APAGADO</h1><p style="color:#555;">Puedes cerrar esta ventana de forma segura.</p></div>';
            }, 1000);
        } catch (e) { alert('Error de conexión.'); }
    }

    const map = L.map('map', { zoomControl: false }).setView([23.6345, -102.5528], 5);
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    const clusterLayer = L.layerGroup().addTo(map);
    
    const onlineIcon = L.divIcon({ className:'', html:'<div style="background:#00ff66;width:14px;height:14px;border-radius:50%;box-shadow:0 0 12px #00ff66;border:2px solid #fff;"></div>', iconSize:[14,14], iconAnchor:[7,7] });
    const offlineIcon = L.divIcon({ className:'', html:'<div style="background:#ff0055;width:14px;height:14px;border-radius:50%;box-shadow:0 0 12px #ff0055;border:2px solid #fff;"></div>', iconSize:[14,14], iconAnchor:[7,7] });

    async function loadDevices(){ try { const r=await fetch(`${API}/api/dispositivos`, {headers:HEADERS}); dispositivos=await r.json(); } catch { dispositivos=[]; } }
    function getDeviceStatus(ts){ return ((new Date()-new Date(ts))/1000/60) < 15 ? 'online' : 'offline'; }

    function renderList(){ 
        const list=document.getElementById('device-list'); list.innerHTML=''; 
        allPositions.forEach(p=>{ 
            const st=getDeviceStatus(p.timestamp); 
            const it=document.createElement('div'); 
            it.className = 'device-item'; it.id = `dev-${p.mid}`;
            it.innerHTML = `
                <div class="dev-title ${st}"><span>${p.mid}</span> <span>${st==='online' ? 'ONLINE' : 'OFFLINE'}</span></div>
                <div class="dev-coords"><span>LAT: ${Number(p.lat).toFixed(4)}</span><span>LON: ${Number(p.lon).toFixed(4)}</span></div>
                <div class="dev-stats"><span>VEL: ${Number(p.speed_kph||0)} km/h</span><span>IGN: ${p.ignition ? 'ON' : 'OFF'}</span><span>COMB: ${p.fuel_level||0}%</span></div>
            `; 
            it.onclick = () => focusDevice(p.mid); 
            list.appendChild(it); 
        }); 
        document.getElementById('kpi-total').textContent=allPositions.length;
        document.getElementById('kpi-online').textContent=allPositions.filter(p=>getDeviceStatus(p.timestamp)==='online').length;
        updateMapMarkers(allPositions); 
    }

    function buildClusterIndex(ps){ scIndex = new Supercluster({ radius:60, maxZoom:17 }); scIndex.load(ps.map(p=>({ type:'Feature', properties:{ mid:p.mid, status:getDeviceStatus(p.timestamp) }, geometry:{ type:'Point', coordinates:[Number(p.lon), Number(p.lat)] } }))); }
    
    function renderClusters(){ 
        if(!scIndex)return; clusterLayer.clearLayers(); 
        const b=map.getBounds(); const cs=scIndex.getClusters([b.getWest(),b.getSouth(),b.getEast(),b.getNorth()], Math.round(map.getZoom())); 
        cs.forEach(c=>{ 
            const [lon,lat]=c.geometry.coordinates; 
            if(c.properties.cluster){ 
                const sz=Math.min(46,26+Math.log2(c.properties.point_count+1)*6); 
                const ic=L.divIcon({ className:'', html:`<div style="background:rgba(0,229,255,0.15); border:1px solid #00e5ff; border-radius:50%; color:#00e5ff; font-weight:bold; display:flex; align-items:center; justify-content:center; width:${sz}px; height:${sz}px;">${c.properties.point_count}</div>`, iconSize:[sz,sz], iconAnchor:[sz/2,sz/2] }); 
                L.marker([lat,lon],{icon:ic}).addTo(clusterLayer); 
            } else { 
                L.marker([lat,lon], {icon: c.properties.status === 'online' ? onlineIcon : offlineIcon}).addTo(clusterLayer).on('click', () => focusDevice(c.properties.mid)); 
            } 
        }); 
    }
    
    function updateMapMarkers(f){ buildClusterIndex(f); renderClusters(); }
    async function loadPositions(){ try { const r = await fetch(`${API}/api/posiciones/latest`, {headers:HEADERS}); allPositions = await r.json(); await loadDevices(); renderList(); } catch(e){ document.getElementById('api-status').innerText='OFFLINE'; document.getElementById('api-status').style.color='var(--neon-red)'; } }

    function focusDevice(mid) {
        const p = allPositions.find(x => x.mid === mid); if(!p) return; 
        map.setView([Number(p.lat), Number(p.lon)], 15); 
        document.querySelectorAll('.device-item').forEach(el => el.classList.remove('active'));
        const el = document.getElementById(`dev-${mid}`); if (el) el.classList.add('active');
        document.getElementById('info-panel').classList.add('open');
        const st = getDeviceStatus(p.timestamp);
        document.getElementById('info-title').innerText = mid;
        
        // Construimos el HTML del panel lateral inyectando la temperatura
        let htmlContent = `
            <div class="stat-box"><div class="stat-label">Estado</div><div class="stat-value" style="color:${st==='online'?'var(--neon-green)':'var(--neon-red)'}">${st.toUpperCase()}</div></div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <div class="stat-box"><div class="stat-label">Velocidad</div><div class="stat-value">${Number(p.speed_kph||0)} <span style="font-size:12px;color:#aaa;">km/h</span></div></div>
                <div class="stat-box"><div class="stat-label">Ignición</div><div class="stat-value">${p.ignition ? 'ON' : 'OFF'}</div></div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Temperatura</div>
                <div class="stat-value" style="color:${p.temperature !== null && p.temperature !== undefined ? 'var(--neon-red)' : '#888'};">
                    ${p.temperature !== null && p.temperature !== undefined ? p.temperature + ' °C' : '--'}
                </div>
            </div>
            <div class="stat-box"><div class="stat-label">Coordenadas</div><div style="font-size:12px; color:var(--neon-cyan); margin-top:5px;">LAT: ${Number(p.lat).toFixed(6)}<br>LON: ${Number(p.lon).toFixed(6)}</div></div>
            <a href="https://www.google.com/maps?q=${p.lat},${p.lon}" target="_blank" class="btn-action" style="text-align:center; text-decoration:none; margin-top:auto;">📍 Abrir en Maps</a>
        `;
        
        document.getElementById('info-data').innerHTML = htmlContent;
    }
    function closePanel() { document.getElementById('info-panel').classList.remove('open'); document.querySelectorAll('.device-item').forEach(el => el.classList.remove('active')); }
    map.on('moveend zoomend', renderClusters);

    async function loadVault() {
        try {
            const res = await fetch(`${API}/api/vault`, { headers: HEADERS });
            const messages = await res.json();
            const types = {
                'GPS': { color: 'var(--neon-green)', bg: 'rgba(0,255,102,0.1)', icon: '📍', items: [] },
                'STATUS': { color: 'var(--neon-orange)', bg: 'rgba(255,170,0,0.1)', icon: '🔋', items: [] },
                'SENSOR': { color: 'var(--neon-purple)', bg: 'rgba(212,0,255,0.1)', icon: '🌡️', items: [] },
                'RED': { color: '#888', bg: 'rgba(136,136,136,0.1)', icon: '📶', items: [] },
                'IDENTIDAD': { color: '#fff', bg: 'rgba(255,255,255,0.1)', icon: '🆔', items: [] },
                'UNKNOWN': { color: 'var(--neon-cyan)', bg: 'rgba(0,229,255,0.1)', icon: '📝', items: [] }
            };
            messages.forEach(m => { const t = m.message_type || 'UNKNOWN'; if (types[t]) types[t].items.push(m); });
            const grid = document.getElementById('vault-grid'); grid.innerHTML = '';
            for (const [key, data] of Object.entries(types)) {
                if (data.items.length === 0) continue; 
                const col = document.createElement('div'); col.className = 'kanban-col';
                let cards = data.items.map(m => `<div class="sms-card" style="border-left-color: ${data.color};"><div class="sms-time" style="display:flex; justify-content:space-between;"><span>📦 ${m.source_mid}</span><span>${new Date(m.timestamp).toLocaleTimeString()}</span></div><div style="color:#ccc;">${m.payload}</div></div>`).join('');
                col.innerHTML = `<div class="kanban-header" style="color: ${data.color}; border-bottom: 1px solid ${data.color}; background: ${data.bg};">${data.icon} ${key} <span style="background:${data.color}; color:#000; padding:2px 6px; border-radius:10px; margin-left:5px;">${data.items.length}</span></div><div class="kanban-body">${cards}</div>`;
                grid.appendChild(col);
            }
            if (messages.length === 0) grid.innerHTML = '<div style="color:var(--text-muted); font-size:12px; padding:20px;">Bóveda vacía.</div>';
        } catch (e) { console.error(e); }
    }

    async function exportVault() {
        try {
            const res = await fetch(`${API}/api/vault/export`, { headers: HEADERS });
            const blob = await res.blob(); const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = `runeforge_auditoria_${new Date().toISOString().slice(0,10)}.csv`;
            document.body.appendChild(a); a.click(); a.remove(); window.URL.revokeObjectURL(url);
        } catch (e) { alert('Error al exportar.'); }
    }

    // === LÓGICA DE ALERTAS EN TIEMPO REAL (SSE) ===
    function initAlertStream() {
        if (!window.EventSource) return;
        const es = new EventSource(`${API}/api/alerts/stream?api_key=RF-NEXUS-SECURE-2026`);
        
        es.onmessage = (event) => {
            try {
                const alert = JSON.parse(event.data);
                showAlert(alert);
            } catch (e) {}
        };
    }

    function showAlert(alert) {
        const container = document.getElementById('alert-container');
        const box = document.createElement('div');
        box.className = 'alert-box';
        box.innerHTML = `
            <div style="font-size:10px; color:#ffb3c6; margin-bottom:4px;">⚠️ ALERTA CRÍTICA</div>
            <div style="font-weight:bold; font-size:13px;">${alert.message}</div>
            <div style="font-size:10px; margin-top:4px; opacity:0.8;">MID: ${alert.mid}</div>
        `;
        container.appendChild(box);

        // Reproducir un sonido de alerta (opcional, usa una URL pública)
        // const audio = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');
        // audio.play().catch(e => {});

        // Eliminar la alerta después de 6 segundos
        setTimeout(() => {
            if(box.parentNode) box.parentNode.removeChild(box);
        }, 6000);
    }
    // ===============================================
    // === LÓGICA DE GEOCERCAS ===
    const drawnItems = new L.FeatureGroup();
    map.addLayer(drawnItems);
    
    const drawControl = new L.Control.Draw({
        position: 'topleft',
        draw: {
            polygon: { allowIntersection: false, shapeOptions: { color: '#00ff66' } },
            rectangle: { shapeOptions: { color: '#00ff66' } },
            circle: false, marker: false, polyline: false, circlemarker: false
        },
        edit: { featureGroup: drawnItems, remove: true }
    });
    map.addControl(drawControl);

    map.on(L.Draw.Event.CREATED, async function (e) {
        const type = e.layerType;
        const layer = e.layer;
        drawnItems.addLayer(layer);
        
        const geojson = layer.toGeoJSON();
        const nombre = prompt("🏷️ Dale un nombre a esta zona (Ej: Patio Central, Ruta Norte):", "Zona " + new Date().toLocaleTimeString());
        
        if (nombre) {
            try {
                await fetch(`${API}/api/geocercas`, {
                    method: 'POST',
                    headers: { ...HEADERS, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre, geojson })
                });
                // Alerta visual de éxito
                showAlert({ type: 'SYSTEM', mid: 'SISTEMA', message: `✅ Zona guardada: ${nombre}` });
            } catch (err) {
                alert("Error al guardar la geocerca");
            }
        }
    });

    async function loadGeocercas() {
        try {
            const res = await fetch(`${API}/api/geocercas`, { headers: HEADERS });
            const data = await res.json();
            data.forEach(zona => {
                const layer = L.geoJSON(zona.geojson, { style: { color: '#00e5ff', fillOpacity: 0.1 } });
                drawnItems.addLayer(layer);
            });
        } catch (e) {}
    }
    // ==========================    loadPositions(); initAlertStream(); loadGeocercas(); 
    setInterval(loadPositions, 5000);
    setInterval(() => { if (document.getElementById('view-vault').style.display === 'flex') loadVault(); }, 5000);
</script>
</body>
</html>
