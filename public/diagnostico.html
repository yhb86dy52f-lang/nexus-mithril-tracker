  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

.backdrop-blur {
  --tw-backdrop-blur: blur(8px);
  backdrop-filter: var(--tw-backdrop-blur) var(--tw-backdrop-brightness) var(--tw-backdrop-contrast) var(--tw-backdrop-grayscale) var(--tw-backdrop-hue-rotate) var(--tw-backdrop-invert) var(--tw-backdrop-opacity) var(--tw-backdrop-saturate) var(--tw-backdrop-sepia);

:root{
  --bg:#05060A;
  --surface:#0A0E1A;
  --surface2:#0E1428;
  --line:#1BE6FF;
  --cyan:#00F0FF;
  --magenta:#FF2EA6;
  --yellow:#FFE600;
  --green:#00FF9D;
  --red:#FF2E4D;
  --text:#D8FBFF;
  --muted:#8EA6BE;
  --panel:rgba(10,18,36,.88);
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#030409;
    --surface:#080C18;
    --panel:rgba(8,12,28,.92);
    --text:#E6FDFF;
  }
}

*{
  box-sizing:border-box
}

html,body,#root{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text)
}

body{
  font-family:Impact, Haettenschweiler, "Arial Narrow Bold", "Arial Narrow", sans-serif;
  overflow-x:clip
}

button,input,select,textarea{
  font:inherit
}

button{
  cursor:pointer
}

.mono{
  font-family:Consolas, "Courier New", Menlo, monospace;
  letter-spacing:.02em
}

.grid-bg{
  background-image:linear-gradient(rgba(0,240,255,.08) 1px, transparent 1px),linear-gradient(90deg, rgba(0,240,255,.08) 1px, transparent 1px);
  background-size:34px 34px;
}

.scanlines:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:1;
  background:repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px);
  opacity:.55
}

.panel{
  background:var(--panel);
  border:1px solid rgba(0,240,255,.45);
  box-shadow:0 0 0 1px rgba(255,46,166,.18), 0 0 28px rgba(0,240,255,.10);
  clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px);
  position:relative
}

.panel-magenta{
  border-color:rgba(255,46,166,.55);
  box-shadow:0 0 28px rgba(255,46,166,.14)
}

.panel-yellow{
  border-color:rgba(255,230,0,.5)
}

.panel-red{
  border-color:rgba(255,46,77,.6)
}

.panel-green{
  border-color:rgba(0,255,157,.5)
}

.glitch{
  position:relative;
  text-shadow:3px 0 var(--magenta), -3px 0 var(--cyan);
  letter-spacing:.04em
}

.badge-pulse{
  animation:pulse 1.5s infinite
}

@keyframes pulse{
  0%,100%{
    opacity:1;
    transform:scale(1)
  }

  50%{
    opacity:.55;
    transform:scale(.97)
  }
}

.tabbtn{
  border:1px solid #24324f;
  background:#0A1225;
  color:#BFEFFF;
  padding:12px 10px;
  min-width:0;
  white-space:nowrap
}

.tabbtn.active{
  background:var(--cyan);
  color:#030710;
  border-color:#fff;
  box-shadow:0 0 22px var(--cyan)
}

.bigbtn{
  background:var(--magenta);
  color:white;
  border:0;
  padding:14px 16px;
  box-shadow:0 0 20px rgba(255,46,166,.4);
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)
}

.bigbtn.cyan{
  background:var(--cyan);
  color:#03101a
}

.bigbtn.yellow{
  background:var(--yellow);
  color:#111
}

.bigbtn.green{
  background:var(--green);
  color:#03130c
}

.bigbtn.ghost{
  background:#111B32;
  color:var(--cyan);
  border:1px solid var(--cyan)
}

.field{
  width:100%;
  background:#050816;
  color:#E8FEFF;
  border:1px solid #27405f;
  padding:12px;
  outline:none
}

.field:focus{
  border-color:var(--cyan);
  box-shadow:0 0 0 3px rgba(0,240,255,.18)
}

.chip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:5px 8px;
  border:1px solid #30455f;
  background:#0A152b;
  font-size:12px
}

.kpi-num{
  font-size:clamp(30px,7vw,52px);
  line-height:.9
}

.truck-probe{
  transition:.3s
}

.cable{
  transition:.2s
}

.cable:hover{
  transform:translateY(-3px);
  filter:brightness(1.25)
}

details{
  border:1px solid #243650;
  background:#081020;
  padding:12px
}

summary{
  cursor:pointer;
  font-weight:bold;
  list-style:none
}

summary::-webkit-details-marker{
  display:none
}

table{
  width:100%;
  border-collapse:collapse
}

th{
  text-align:left;
  background:#0A1B33;
  color:var(--cyan);
  padding:9px;
  font-size:12px;
  border-bottom:1px solid #24405e
}

td{
  padding:9px;
  border-bottom:1px solid #18273e;
  font-family:Consolas,monospace;
  font-size:13px
}

::-webkit-scrollbar{
  width:9px;
  height:9px
}

::-webkit-scrollbar-thumb{
  background:#FF2EA6
}

@media(max-width:640px){
  .tabbtn{
    font-size:12px;
    padding:11px 7px
  }

  .kpi-num{
    font-size:34px
  }
}

.hover\:border-\[\#00F0FF\]:hover {
  --tw-border-opacity: 1;
  border-color: rgb(0 240 255 / var(--tw-border-opacity, 1));
}

.hover\:brightness-125:hover {
  --tw-brightness: brightness(1.25);
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

@media (min-width: 640px) {
  .sm\:-mx-5 {
    margin-left: -1.25rem;
    margin-right: -1.25rem;
  }

  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:grid-cols-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .sm\:flex-row {
    flex-direction: row;
  }

  .sm\:px-5 {
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }

  .sm\:text-4xl {
    font-size: 2.25rem;
    line-height: 2.5rem;
  }

  .sm\:text-xs {
    font-size: 0.75rem;
    line-height: 1rem;
  }
}

@media (min-width: 768px) {
  .md\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .md\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .md\:grid-cols-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}

@media (min-width: 1024px) {
  .lg\:col-span-2 {
    grid-column: span 2 / span 2;
  }

  .lg\:col-span-3 {
    grid-column: span 3 / span 3;
  }

  .lg\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .lg\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .lg\:grid-cols-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .lg\:grid-cols-5 {
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }

  .lg\:grid-cols-7 {
    grid-template-columns: repeat(7, minmax(0, 1fr));
  }

  .lg\:grid-cols-8 {
    grid-template-columns: repeat(8, minmax(0, 1fr));
  }
}

@media (min-width: 1280px) {
  .xl\:grid-cols-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}
