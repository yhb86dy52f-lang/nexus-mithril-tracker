<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CT NEXUS // THERMO LAB v2.0 (PRO)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-base: #05050A;
  --bg-gradient: radial-gradient(circle at 15% 50%, rgba(168, 85, 247, 0.08), transparent 40%),
                 radial-gradient(circle at 85% 30%, rgba(34, 211, 238, 0.08), transparent 40%);
  --glass-bg: rgba(20, 20, 34, 0.6);
  --glass-border: rgba(255, 255, 255, 0.08);
  --txt: #F8FAFC;
  --muted: #94A3B8;
  --cyan: #22D3EE;
  --purple: #A855F7;
  --green: #10B981;
  --red: #F43F5E;
  --amber: #F59E0B;
  --font-ui: 'Inter', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background-color: var(--bg-base);
  background-image: var(--bg-gradient);
  color: var(--txt);
  font-family: var(--font-ui);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}

/* TOPBAR */
.topbar {
  height: 70px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 30px;
  background: rgba(5, 5, 10, 0.8);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--glass-border);
  position: sticky;
  top: 0;
  z-index: 50;
}
.brand {
  display: flex;
  flex-direction: column;
}
.brand b {
  font-size: 16px;
  letter-spacing: 0.1em;
  color: var(--txt);
  text-shadow: 0 0 10px rgba(34, 211, 238, 0.4);
}
.brand span {
  font-size: 10px;
  color: var(--cyan);
  letter-spacing: 0.2em;
  font-weight: 700;
  margin-top: 2px;
}
.nav-btn {
  color: var(--muted);
  text-decoration: none;
  font-size: 12px;
  font-weight: 700;
  border: 1px solid var(--glass-border);
  padding: 8px 16px;
  border-radius: 8px;
  transition: all 0.3s ease;
  background: rgba(255, 255, 255, 0.02);
}
.nav-btn:hover {
  color: var(--cyan);
  border-color: var(--cyan);
  box-shadow: 0 0 15px rgba(34, 211, 238, 0.2);
}

/* LAYOUT GRID */
.container {
  max-width: 1400px;
  width: 100%;
  margin: 0 auto;
  padding: 30px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  flex: 1;
}

/* PANELS */
.panel {
  background: var(--glass-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  padding: 24px;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  display: flex;
  flex-direction: column;
}
.panel-title {
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.15em;
  font-weight: 800;
  margin-bottom: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.panel-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--glass-border) 0%, transparent 100%);
  margin-left: 15px;
}

/* KPIS (Mini tarjetas superiores) */
.kpis {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 24px;
  grid-column: 1 / -1;
}
.kpi {
  background: rgba(20, 20, 34, 0.4);
  border: 1px solid var(--glass-border);
  border-radius: 12px;
  padding: 16px;
  position: relative;
  overflow: hidden;
  transition: all 0.3s;
}
.kpi::before {
  content: '';
  position: absolute;
  top: 0; left: 0; width: 100%; height: 2px;
  background: linear-gradient(90deg, var(--cyan), var(--purple));
  opacity: 0.5;
}
.kpi label {
  font-size: 10px;
  letter-spacing: 0.15em;
  color: var(--muted);
  font-weight: 800;
  display: block;
}
.kpi b {
  display: block;
  font-size: 20px;
  font-family: var(--font-mono);
  margin-top: 8px;
  color: var(--txt);
  text-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
}

/* INPUT AREA */
textarea {
  width: 100%;
  height: 200px;
  background: rgba(0, 0, 0, 0.4);
  border: 1px solid var(--glass-border);
  color: var(--cyan);
  padding: 16px;
  border-radius: 12px;
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.6;
  resize: vertical;
  outline: none;
  transition: all 0.3s ease;
}
textarea::placeholder { color: rgba(255,255,255,0.2); }
textarea:focus {
  border-color: var(--cyan);
  box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.15);
  background: rgba(0, 0, 0, 0.6);
}

.chips {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
}
.chip {
  font-size: 11px;
  font-weight: 600;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--glass-border);
  color: var(--muted);
  padding: 8px 14px;
  border-radius: 99px;
  cursor: pointer;
  transition: all 0.2s;
}
.chip:hover {
  color: var(--txt);
  border-color: var(--purple);
  background: rgba(168, 85, 247, 0.1);
}

/* BUTTONS */
.btn-primary {
  background: linear-gradient(135deg, var(--cyan), var(--purple));
  color: #000;
  border: none;
  padding: 16px 24px;
  border-radius: 12px;
  font-weight: 800;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.3s;
  margin-top: 16px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  position: relative;
  overflow: hidden;
}
.btn-primary:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 10px 20px rgba(168, 85, 247, 0.3);
}
.btn-primary:active:not(:disabled) { transform: translateY(0); }
.btn-primary:disabled {
  opacity: 0.7;
  cursor: not-allowed;
  filter: grayscale(0.5);
}

.btn-row { display: flex; gap: 10px; margin-top: 12px; }
.btn-secondary {
  flex: 1;
  background: rgba(255,255,255,0.03);
  color: var(--txt);
  border: 1px solid var(--glass-border);
  padding: 12px;
  border-radius: 10px;
  font-weight: 600;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-secondary:hover {
  background: rgba(255,255,255,0.08);
  border-color: var(--muted);
}

/* OUTPUT AREA (Terminal) */
.output-wrapper {
  position: relative;
  flex: 1;
  min-height: 300px;
  border-radius: 12px;
  background: #020205;
  border: 1px solid var(--glass-border);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.output-header {
  background: rgba(255,255,255,0.03);
  padding: 10px 16px;
  border-bottom: 1px solid var(--glass-border);
  display: flex;
  gap: 6px;
}
.dot { width: 10px; height: 10px; border-radius: 50%; }
.dot.r { background: #FF5F56; }
.dot.y { background: #FFBD2E; }
.dot.g { background: #27C93F; }

pre {
  padding: 20px;
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.6;
  overflow: auto;
  flex: 1;
  margin: 0;
  color: var(--muted);
}

/* SINTAXIS JSON */
.json-key { color: var(--purple); }
.json-string { color: var(--cyan); }
.json-number { color: var(--amber); }
.json-boolean { color: var(--red); font-weight: bold; }
.json-null { color: var(--muted); font-style: italic; }

/* TOASTS (Notificaciones) */
#toast-container {
  position: fixed;
  bottom: 30px;
  right: 30px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.toast {
  background: var(--glass-bg);
  backdrop-filter: blur(10px);
  border-left: 4px solid var(--cyan);
  padding: 16px 24px;
  border-radius: 8px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  color: var(--txt);
  font-size: 13px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 10px;
  animation: slideIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}
.toast.err { border-left-color: var(--red); }
@keyframes slideIn {
  from { transform: translateX(100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

/* RESPONSIVE */
@media (max-width: 900px) {
  .container { grid-template-columns: 1fr; padding: 15px; }
  .kpis { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <b>CT NEXUS // THERMO LAB</b>
    <span>PRO DIAGNOSTIC ENGINE</span>
  </div>
  <a href="/fleet.html" class="nav-btn">🗺️ VOLVER AL RADAR</a>
</div>

<div class="container">
  
  <!-- KPIs SUPERIORES -->
  <div class="kpis">
    <div class="kpi">
      <label>FAMILIA</label>
      <b id="kpi-family">—</b>
    </div>
    <div class="kpi">
      <label>DISPOSITIVO (ESN)</label>
      <b id="kpi-device">—</b>
    </div>
    <div class="kpi">
      <label>ESTADO DEL PARSER</label>
      <b id="kpi-status" style="color:var(--muted); font-size:16px;">Esperando</b>
    </div>
  </div>

  <!-- COLUMNA IZQUIERDA: ENTRADA -->
  <div class="panel">
    <div class="panel-title">Entrada de Datos (Payload / SMS)</div>
    <textarea id="input-text" placeholder="Pega el payload Hexadecimal o el SMS crudo aquí...
Ejemplo: ! E4764312747FFFF...
Ejemplo: GPS:3D-DIFF 11 LAT:19.4003153 LON:-97.6227735 HDG:235"></textarea>
    
    <div class="chips">
      <button class="chip" onclick="cargarEjemplo('hex')">Ejemplo HEX !r4</button>
      <button class="chip" onclick="cargarEjemplo('gps')">Ejemplo GPS</button>
      <button class="chip" onclick="cargarEjemplo('app')">Ejemplo APP / !r0</button>
      <span id="char-count" style="margin-left:auto; font-size:11px; color:var(--muted); align-self:center;">0 caracteres</span>
    </div>

    <button class="btn-primary" id="btn-decode" onclick="decodeInput()">🔬 Ejecutar Decodificación</button>
    
    <div class="btn-row">
      <button class="btn-secondary" onclick="limpiarDiagnostico()">🧹 Limpiar Consola</button>
      <button class="btn-secondary" onclick="copiarResultado()">📋 Copiar JSON</button>
    </div>
  </div>

  <!-- COLUMNA DERECHA: SALIDA -->
  <div class="panel">
    <div class="panel-title">Consola de Salida (Backend Response)</div>
    <div class="output-wrapper">
      <div class="output-header">
        <div class="dot r"></div>
        <div class="dot y"></div>
        <div class="dot g"></div>
        <span style="font-size: 10px; color: var(--muted); margin-left: auto; font-family: var(--font-mono);">ENDPOINT: POST /api/diagnostico/parse</span>
      </div>
      <pre id="output">> SYSTEM READY.
> Waiting for payload...</pre>
    </div>
  </div>

</div>

<div id="toast-container"></div>

<script>
const EJEMPLOS = {
  hex: "! E4764312747FFFF-\nF0100006AE050776AE05077\n0B904061C5CF-\nF2960000000200EB0-\nB020014FFA34F0D1E00FFF-\nF040000321C00000-\nF580020001E00000400",
  gps: "GPS:3D-DIFF 11\nLAT:19.4003153\nLON:-97.6227735\nHDG:235\nSPD:0 kph, 0 mph\nMID:4764312747 ESN\nAGC:54%",
  app: "APP:445 8.7b\nCOM:-71 DaL\ninternet.itelcel.com\nGPS:3D-DIFF 19\nINP:0000000000000111\n12.6V\nMID:7000276167 ESN"
};

// Inicialización
document.getElementById('input-text').addEventListener('input', (e) => {
  document.getElementById('char-count').textContent = e.target.value.length + ' caracteres';
});

function cargarEjemplo(tipo) {
  const ta = document.getElementById('input-text');
  ta.value = EJEMPLOS[tipo] || '';
  ta.dispatchEvent(new Event('input'));
  ta.focus();
  showToast('Ejemplo cargado: ' + tipo.toUpperCase());
}

// Sistema de Notificaciones (Toasts)
function showToast(msg, type = 'ok') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = 'toast ' + type;
  toast.innerHTML = (type === 'ok' ? '✅ ' : '❌ ') + msg;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.animation = 'slideOut 0.3s ease forwards';
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

// Función para resaltar JSON (Syntax Highlighting)
function syntaxHighlight(json) {
    if (typeof json != 'string') {
         json = JSON.stringify(json, undefined, 2);
    }
    json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
        var cls = 'json-number';
        if (/^"/.test(match)) {
            if (/:$/.test(match)) {
                cls = 'json-key';
            } else {
                cls = 'json-string';
            }
        } else if (/true|false/.test(match)) {
            cls = 'json-boolean';
        } else if (/null/.test(match)) {
            cls = 'json-null';
        }
        return '<span class="' + cls + '">' + match + '</span>';
    });
}

// Lógica Principal de Fetch
async function decodeInput() {
    const texto = document.getElementById('input-text').value.trim();
    const output = document.getElementById('output');
    const btn = document.getElementById('btn-decode');
    const kpiStatus = document.getElementById('kpi-status');
    const kpiFamily = document.getElementById('kpi-family');
    const kpiDevice = document.getElementById('kpi-device');

    if (!texto) {
        showToast('Pega un texto o payload primero.', 'err');
        return;
    }

    // UI Loading State
    output.innerHTML = '<span style="color:var(--amber)">> [PROCESANDO] Consultando al backend...</span>';
    kpiStatus.textContent = 'Decodificando...';
    kpiStatus.style.color = 'var(--amber)';
    btn.disabled = true;
    btn.innerHTML = '⏳ PROCESANDO...';

    try {
        const res = await fetch('/api/diagnostico/parse', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ texto: texto })
        });
        
        const data = await res.json();
        
        if (res.ok) {
            const parsed = data.parsed || data;
            
            // Imprimir con sintaxis de colores
            output.innerHTML = syntaxHighlight(JSON.stringify(parsed, null, 2));
            
            // Actualizar KPIs
            kpiFamily.textContent = parsed.family || parsed.familia || '—';
            kpiDevice.textContent = parsed.device || parsed.esn || parsed.mid || parsed.MID || '—';
            
            kpiStatus.textContent = 'OK';
            kpiStatus.style.color = 'var(--green)';
            showToast('Decodificación exitosa');
        } else {
            output.innerHTML = '<span style="color:var(--red)">> [ERROR BACKEND] ' + (data.error || res.status) + '</span>';
            kpiStatus.textContent = 'Error';
            kpiStatus.style.color = 'var(--red)';
            showToast('Error del servidor', 'err');
        }
    } catch (e) {
        output.innerHTML = '<span style="color:var(--red)">> [ERROR DE RED] ' + e.message + '</span>';
        kpiStatus.textContent = 'Fallo Red';
        kpiStatus.style.color = 'var(--red)';
        showToast('Error de red: ' + e.message, 'err');
    } finally {
        btn.disabled = false;
        btn.innerHTML = '🔬 Ejecutar Decodificación';
    }
}

function limpiarDiagnostico() {
    document.getElementById('input-text').value = '';
    document.getElementById('char-count').textContent = '0 caracteres';
    document.getElementById('output').innerHTML = '> SYSTEM READY.\n> Waiting for payload...';
    document.getElementById('kpi-family').textContent = '—';
    document.getElementById('kpi-device').textContent = '—';
    document.getElementById('kpi-status').textContent = 'Esperando';
    document.getElementById('kpi-status').style.color = 'var(--muted)';
}

async function copiarResultado() {
    const outputText = document.getElementById('output').innerText;
    if (outputText.includes('Waiting for payload') || outputText.includes('PROCESANDO')) {
        showToast('No hay resultado válido para copiar', 'err');
        return;
    }
    try {
        await navigator.clipboard.writeText(outputText);
        showToast('JSON copiado al portapapeles');
    } catch (e) {
        showToast('No se pudo copiar: ' + e.message, 'err');
    }
}
</script>
</body>
</html>
