        /* Ajustes para el mapa dentro del layout de Anduril */
        body { overflow: hidden; display: flex; flex-direction: column; height: 100vh; background: #050508; color: #fff; font-family: 'Rajdhani', sans-serif; }
        #map { flex: 1; width: 100%; z-index: 1; }
        .header { height: 60px; display: flex; align-items: center; padding: 0 20px; background: rgba(10,10,18,0.9); border-bottom: 1px solid rgba(0,229,255,0.2); z-index: 10; justify-content: space-between; }
        .header h1 { font-family: 'Cinzel Decorative', serif; color: #00e5ff; letter-spacing: 2px; font-size: 20px; text-shadow: 0 0 10px rgba(0,229,255,0.5); }
        .sidebar { position: absolute; left: 20px; top: 80px; width: 320px; height: calc(100vh - 100px); z-index: 10; display: flex; flex-direction: column; }
    </style>
</head>
<body>
    <div class="header">
        <h1>NEXUS-MITHRIL // V3</h1>
        <div class="mono" id="status" style="color: #ff0055;">DESCONECTADO</div>
    </div>

    <div id="map"></div>

    <!-- Panel lateral usando las clases de Anduril (glass, gothic-corner, etc) -->
    <div class="sidebar glass gothic-corner rounded-[14px] p-4">
        <div class="flex justify-between items-center mb-4">
            <h2 class="cinzel text-[14px] tracking-widest text-[#ffaa00]">FLOTA ACTIVA</h2>
            <span class="mono text-[12px] text-[#00ff66]" id="online-count">0 EN LÍNEA</span>
        </div>
        <div class="grid grid-cols-2 gap-2 mb-4">
            <div class="bg-white/5 p-2 rounded-lg text-center border border-white/10">
                <div class="mono text-[18px] text-[#00e5ff]" id="total-count">0</div>
                <div class="text-[10px] text-white/50">TOTAL</div>
            </div>
            <div class="bg-white/5 p-2 rounded-lg text-center border border-white/10">
                <div class="mono text-[18px] text-[#00ff66]" id="active-count">0</div>
                <div class="text-[10px] text-white/50">EN LÍNEA</div>
            </div>
        </div>
        <div class="flex-1 overflow-y-auto" id="vehicle-list">
            <!-- Las unidades se inyectarán aquí -->
        </div>
    </div>

    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <script>
        // MAPA FUNCIONAL CON ESTILO OSCURO
        var map = new maplibregl.Map({
            container: 'map',
            style: {
                version: 8,
                sources: { 'osm': { type: 'raster', tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize: 256 } },
                layers: [{ id: 'osm', type: 'raster', source: 'osm', paint: { 'raster-brightness-max': 0.5, 'raster-contrast': 1.5, 'raster-saturation': -1 } }]
            },
            center: [-103.52, 25.54],
            zoom: 6
        });

        var FLEET = [];

        map.on('load', function() {
            map.addSource('fleet', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
            
            // Puntos con glow neón
            map.addLayer({
                id: 'fleet-glow',
                type: 'circle',
                source: 'fleet',
                paint: { 'circle-radius': 12, 'circle-color': '#00e5ff', 'circle-opacity': 0.3, 'circle-blur': 1 }
            });
            map.addLayer({
                id: 'fleet-points',
                type: 'circle',
                source: 'fleet',
                paint: {
                    'circle-radius': 6,
                    'circle-color': ['case', ['==', ['get', 'online'], true], '#00ff66', '#ff0055'],
                    'circle-stroke-width': 2,
                    'circle-stroke-color': '#000'
                }
            });

            loadPositions();
            setInterval(loadPositions, 5000);
        });

        async function loadPositions() {
            try {
                var res = await fetch('/api/posiciones/latest');
                if (!res.ok) throw new Error('HTTP ' + res.status);
                var data = await res.json();
                var arr = Array.isArray(data) ? data : (data.positions || data.devices || []);
                
                FLEET = arr.map(function(p) {
                    var lat = Number(p.lat || p.latitude);
                    var lon = Number(p.lon || p.lng || p.longitude);
                    var id = p.nombre || p.device || p.id || 'SIN-ID';
                    var ts = p.timestamp ? new Date(p.timestamp).getTime() : 0;
                    var isRecent = ts > 0 && (new Date().getTime() - ts) < (24 * 60 * 60 * 1000); // 24 horas
                    return { id: id, lat: lat, lon: lon, online: isRecent };
                }).filter(function(u) { return !isNaN(u.lat) && !isNaN(u.lon); });

                var geojson = {
                    type: 'FeatureCollection',
                    features: FLEET.map(function(u) {
                        return { type: 'Feature', geometry: { type: 'Point', coordinates: [u.lon, u.lat] }, properties: { id: u.id, online: u.online } };
                    })
                };
                map.getSource('fleet').setData(geojson);

                // Actualizar UI con diseño Anduril
                var onCount = FLEET.filter(function(u) { return u.online; }).length;
                document.getElementById('total-count').textContent = FLEET.length;
                document.getElementById('active-count').textContent = onCount;
                document.getElementById('online-count').textContent = onCount + ' EN LÍNEA';
                
                var listEl = document.getElementById('vehicle-list');
                listEl.innerHTML = '';
                FLEET.forEach(function(u) {
                    var d = document.createElement('div');
                    d.className = 'p-2 mb-2 rounded-lg border transition-all cursor-pointer ' + (u.online ? 'border-[#00ff66]/50 bg-[#00ff66]/10' : 'border-white/10 bg-white/5');
                    d.innerHTML = '<div class="flex justify-between items-center"><b class="text-[13px] text-white">' + u.id + '</b><span class="mono text-[9px] ' + (u.online ? 'text-[#00ff66]' : 'text-[#ff0055]') + '">' + (u.online ? 'ACTIVO' : 'INACTIVO') + '</span></div><small class="mono text-[10px] text-white/50">' + u.lat.toFixed(4) + ', ' + u.lon.toFixed(4) + '</small>';
                    d.onclick = function() { map.flyTo({ center: [u.lon, u.lat], zoom: 14 }); };
                    listEl.appendChild(d);
                });

                document.getElementById('status').textContent = 'SISTEMA EN LÍNEA';
                document.getElementById('status').style.color = '#00ff66';
            } catch (e) {
                document.getElementById('status').textContent = 'ERROR DE CONEXIÓN';
                document.getElementById('status').style.color = '#ff0055';
            }
        }
    </script>
</body>
</html>
