<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS-MITHRIL // OSIRIS 3D</title>
  <link id="ml-css" href="/vendor/maplibre-gl/maplibre-gl.css" rel="stylesheet" />
      <style>
      :root {
        --void: #05030A; --glass: rgba(20, 15, 30, 0.75); --glass-border: rgba(168, 85, 247, 0.3);
        --txt: #F8FAFC; --muted: #94A3B8; --neon-purple: #A855F7; --neon-cyan: #22D3EE;
        --neon-green: #22C55E; --neon-amber: #F59E0B;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body, html { width: 100%; height: 100%; background: var(--void); font-family: 'Inter', system-ui, sans-serif; color: var(--txt); overflow: hidden; }
      #map { position: absolute; inset: 0; width: 100%; height: 100%; background: #020408; }
      
      .topbar { position: absolute; top: 16px; left: 16px; right: 16px; z-index: 10; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; }
      .brand { display: flex; align-items: center; gap: 14px; background: var(--glass); padding: 10px 18px; border-radius: 12px; border: 1px solid var(--glass-border); backdrop-filter: blur(12px); pointer-events: auto; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
      .brand-icon { width: 36px; height: 36px; border-radius: 10px; background: url('/anduril-icono.jpg') center/cover, linear-gradient(135deg, var(--neon-purple), var(--neon-cyan)); box-shadow: 0 0 15px rgba(168, 85, 247, 0.5); }
      .brand-title { font-weight: 800; letter-spacing: 1.5px; font-size: 16px; background: linear-gradient(90deg, #fff, var(--neon-cyan)); -webkit-background-clip: text; color: transparent; }
      .brand-sub { font-size: 10px; letter-spacing: 1px; color: var(--neon-purple); font-weight: 700; }
      
      .telemetry-pills { display: flex; gap: 10px; pointer-events: auto; }
      .pill { background: var(--glass); border: 1px solid var(--glass-border); padding: 8px 14px; border-radius: 10px; font-size: 12px; font-weight: 800; backdrop-filter: blur(12px); color: var(--neon-cyan); }
      .pill.live { color: var(--neon-green); border-color: rgba(34,197,94,0.4); box-shadow: 0 0 15px rgba(34,197,94,0.2); }

      .sidebar { position: absolute; top: 90px; left: 16px; bottom: 90px; width: 320px; z-index: 10; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; backdrop-filter: blur(16px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
      .sidebar-header { font-size: 11px; font-weight: 800; letter-spacing: 1.5px; color: var(--muted); margin-bottom: 14px; display: flex; justify-content: space-between; }
      .sidebar-header span { color: var(--neon-green); }
      
      .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
      .stat-box { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.05); border-radius: 10px; padding: 10px; }
      .stat-label { font-size: 9px; color: var(--muted); letter-spacing: 1px; font-weight: 800; }
      .stat-val { font-size: 20px; font-weight: 800; margin-top: 4px; font-family: 'JetBrains Mono', monospace; }
      .stat-val.green { color: var(--neon-green); } .stat-val.amber { color: var(--neon-amber); }

      .search-box { width: 100%; background: rgba(0,0,0,0.5); border: 1px solid var(--glass-border); border-radius: 8px; padding: 10px 14px; color: #fff; font-size: 13px; margin-bottom: 14px; outline: none; transition: 0.2s; }
      .search-box:focus { border-color: var(--neon-cyan); box-shadow: 0 0 10px rgba(34,211,238,0.2); }
      
      .unit-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; }
      .unit-card { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 12px; cursor: pointer; transition: all 0.2s; display: flex; justify-content: space-between; align-items: center; }
      .unit-card:hover { background: rgba(168, 85, 247, 0.1); border-color: var(--neon-purple); transform: translateX(4px); }
      .unit-name { font-size: 13px; font-weight: 800; color: #fff; }
      .unit-coords { font-size: 10px; color: var(--neon-cyan); font-family: monospace; margin-top: 4px; }
      .badge-off { font-size: 9px; font-weight: 800; padding: 4px 8px; border-radius: 6px; background: rgba(244,63,94,0.15); color: #FDA4AF; border: 1px solid rgba(244,63,94,0.3); }
      .badge-on { font-size: 9px; font-weight: 800; padding: 4px 8px; border-radius: 6px; background: rgba(34,197,94,0.15); color: #86EFAC; border: 1px solid rgba(34,197,94,0.3); }

      .map-controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; background: var(--glass); padding: 10px 16px; border-radius: 16px; border: 1px solid var(--glass-border); backdrop-filter: blur(12px); box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
      .map-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: var(--muted); padding: 8px 16px; border-radius: 8px; font-size: 11px; font-weight: 800; cursor: pointer; transition: 0.2s; }
      .map-btn.active { background: var(--neon-purple); color: #fff; border-color: var(--neon-purple); box-shadow: 0 0 15px rgba(168,85,247,0.4); }
      .map-btn:hover:not(.active) { border-color: var(--neon-cyan); color: var(--neon-cyan); }

      .terrain-pill { position: absolute; bottom: 85px; left: 50%; transform: translateX(-50%); z-index: 10; background: var(--glass); border: 1px solid var(--glass-border); padding: 6px 12px; border-radius: 8px; font-size: 11px; letter-spacing: 0.5px; color: var(--muted); backdrop-filter: blur(8px); }
      .terrain-pill b { color: var(--neon-amber); }
      
      #osiris-diag { display: none !important; }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 10px; }
    </style>
</head>
<body>
  <div id="map"></div>
  
  <div class="topbar">
    <div class="brand">
      <div class="brand-icon"></div>
      <div>
        <div class="brand-title">NEXUS-MITHRIL</div>
        <div class="brand-sub">OSIRIS 3D PROTOCOL</div>
      </div>
    </div>
    <div class="telemetry-pills">
      <div class="pill" id="zulu-clock">ZULU --:--:--Z</div>
      <div class="pill" id="entity-count">UNITS 0</div>
      <div class="pill live">EN VIVO</div>
    </div>
  </div>

  <div class="sidebar">
    <div class="sidebar-header">FLOTA GLOBAL - <span id="online-label">0 EN LÍNEA</span></div>
    <div class="stats-grid">
      <div class="stat-box"><div class="stat-label">TOTAL</div><div class="stat-val" id="stat-total">0</div></div>
      <div class="stat-box"><div class="stat-label">ACTIVOS</div><div class="stat-val green" id="stat-online">0</div></div>
      <div class="stat-box"><div class="stat-label">FUERA</div><div class="stat-val amber" id="stat-offline">0</div></div>
    </div>
    <input type="text" class="search-box" id="unit-search" placeholder="Buscar unidad..." />
    <div class="unit-list" id="unit-list"></div>
  </div>

  <div class="terrain-pill" id="terrain-pill">TERRENO: <b id="terrain-status">idle</b> &nbsp;|&nbsp; Activo con zoom &ge; 10</div>
  
  <div class="map-controls">
    <button class="map-btn active" id="btn-3d">3D GLOBO</button>
    <button class="map-btn" id="btn-2d">2D PLANO</button>
    <button class="map-btn active" id="btn-map">MAP (DARK)</button>
    <button class="map-btn" id="btn-sat">SAT</button>
    <button class="map-btn" id="btn-relieve">RELIEVE 3D</button>
    <button class="map-btn" id="btn-mexico">MEXICO</button>
    <button class="map-btn" id="btn-spin">GIRAR</button>
  </div>

      <script>
      let API_KEY = localStorage.getItem('nexus_api_key');
      if (!API_KEY) {
        API_KEY = prompt('🔒 NEXUS-MITHRIL OSIRIS 3D\nIntroduce la API Key (por defecto: RF-NEXUS-SECURE-2026):');
        if (API_KEY) localStorage.setItem('nexus_api_key', API_KEY);
        else { document.body.innerHTML = '<h1 style="color:red;text-align:center;margin-top:20vh">Acceso Denegado</h1>'; throw new Error('Auth cancelada'); }
      }
    </script>
    <script>
    // Configuración de carga de MapLibre
    window.__mlSources = ['/vendor/maplibre-gl/maplibre-gl.js', '/vendor/maplibre-gl@5.7.0/maplibre-gl.js'];
    window.__mlReady = new Promise((resolve, reject) => {
      let i = 0;
      function tryNext() {
        if (i >= window.__mlSources.length) { reject(new Error('local vendor missing')); return; }
        const url = window.__mlSources[i++];
        const s = document.createElement('script');
        s.src = url;
        s.onload = () => resolve();
        s.onerror = () => tryNext();
        document.head.appendChild(s);
      }
      tryNext();
    });
  </script>
  <script>
    setInterval(() => { document.getElementById('zulu-clock').textContent = 'ZULU ' + new Date().toISOString().substr(11, 8) + 'Z'; }, 1000);
    
    window.__mlReady.then(() => {
    const DARK_STYLE_URL = 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json';
    const ESRI_URL = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
    const facingLng = Math.max(-180, Math.min(180, -new Date().getTimezoneOffset() / 4));
    
    let currentProjectionMode = 'globe';
    let currentStyle = 'dark';
    let terrainEnabled = false, terrainActive = false, terrainStatus = 'idle';
    let activationTimer = null, fadeFrame = null;
    const TERRAIN_SOURCE = 'osiris-terrain-dem';
    
    function setTerrainStatus(s) { terrainStatus = s; document.getElementById('terrain-status').textContent = s; }
    
    function getTerrainProjection() {
      if (currentProjectionMode === 'mercator') return { type: 'mercator' };
      if (terrainEnabled) return { type: ['interpolate', ['linear'], ['zoom'], 7, 'vertical-perspective', 9, 'mercator'] };
      return { type: 'globe' };
    }
    
    function applyProjection() {
      try { if (!map.isStyleLoaded()) { map.once('style.load', () => { try { map.setProjection(getTerrainProjection()); } catch(e){} }); return; } map.setProjection(getTerrainProjection()); } catch (e) {}
      updateTerrain();
    }
    
    function fadeTerrain(to, done) {
      if (fadeFrame) cancelAnimationFrame(fadeFrame);
      const terrain = map.getTerrain();
      const from = terrain ? terrain.exaggeration : to;
      if (!terrain || from === to) { if (done) done(); return; }
      let start;
      const step = (now) => {
        start = start || now;
        const t = Math.min(1, (now - start) / (600 * Math.abs(to - from)));
        terrain.exaggeration = from + (to - from) * t * t * (3 - 2 * t);
        map.triggerRepaint();
        if (t < 1) fadeFrame = requestAnimationFrame(step);
        else { fadeFrame = undefined; if (done) done(); }
      };
      fadeFrame = requestAnimationFrame(step);
    }
    
    function releaseTerrain() {
      terrainActive = false;
      if (fadeFrame) cancelAnimationFrame(fadeFrame);
      try { if (map.getTerrain() && map.getTerrain().source === TERRAIN_SOURCE) map.setTerrain(null); } catch(e) {}
      try { if (map.getSource(TERRAIN_SOURCE)) map.removeSource(TERRAIN_SOURCE); } catch(e) {}
      try { map.setMaxPitch(85); } catch(e) {}
    }
    
    function activateTerrain() {
      activationTimer = null;
      if (!terrainEnabled || terrainActive || map.isMoving() || document.hidden || map.getZoom() < 10) return;
      terrainActive = true;
      setTerrainStatus('loading');
      try {
        map.addSource(TERRAIN_SOURCE, { type: 'raster-dem', tiles: ['https://demotiles.maplibre.org/terrain-tiles/{z}/{x}/{y}.png'], encoding: 'terrarium', tileSize: 256, maxzoom: 10 });
        try { map.setMaxPitch(60); } catch(e) {}
        map.setTerrain({ source: TERRAIN_SOURCE, exaggeration: 1 });
        map.getTerrain().exaggeration = 0;
      } catch (e) { releaseTerrain(); setTerrainStatus('error'); }
    }
    
    function updateTerrain() {
      if (!terrainEnabled) { if (terrainActive) { releaseTerrain(); } setTerrainStatus('idle'); return; }
      if (terrainActive) return;
      if (activationTimer) clearTimeout(activationTimer);
      if (map.getZoom() < 10) { setTerrainStatus('idle'); return; }
      setTerrainStatus('waiting');
      if (!map.isMoving() && !document.hidden) activationTimer = setTimeout(activateTerrain, 500);
    }
    
    function onZoomTerrain() {
      if (!terrainActive && map.getZoom() < 10) { if (activationTimer) clearTimeout(activationTimer); if (terrainEnabled) setTerrainStatus('idle'); }
      if (terrainActive && map.getZoom() < 9.5) { releaseTerrain(); setTerrainStatus('idle'); }
    }
    
    function onDataTerrain(e) {
      if (terrainActive && e.sourceId === TERRAIN_SOURCE && e.isSourceLoaded && (e.tile || e.sourceDataType === 'idle')) {
        setTerrainStatus('ready');
        if (map.getTerrain() && map.getTerrain().exaggeration === 0) fadeTerrain(1);
      }
    }

    const OSM_RASTER_STYLE = { version: 8, sources: { 'osm': { type: 'raster', tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize: 256 } }, layers: [ { id: 'background', type: 'background', paint: { 'background-color': '#020408' } }, { id: 'osm-base', type: 'raster', source: 'osm', minzoom: 0, maxzoom: 19 } ] };
    
    const baseOptions = {
      container: 'map', style: DARK_STYLE_URL,
      center: [facingLng, 20], zoom: 1.8, minZoom: 1.5, maxZoom: 18,
      attributionControl: { compact: true }, maxPitch: 85, antialias: true, projection: { type: 'globe' }
    };
    
    let map = null;
    const attributeFallbacks = [ undefined, { powerPreference: 'low-power', failIfMajorPerformanceCaveat: false }, { powerPreference: 'low-power', failIfMajorPerformanceCaveat: false, antialias: false } ];
    for (const attrs of attributeFallbacks) {
      try { map = new maplibregl.Map(attrs ? { ...baseOptions, canvasContextAttributes: attrs } : baseOptions); break; } catch (e) { document.getElementById('map').innerHTML = ''; if (attrs === attributeFallbacks[attributeFallbacks.length-1]) throw e; }
    }
    
    let styleFallbackDone = false;
    function fallbackToDemo(reason) {
      if (styleFallbackDone) return;
      styleFallbackDone = true;
      currentStyle = 'demo';
      try { map.setStyle(OSM_RASTER_STYLE); map.once('style.load', () => { applyProjection(); }); } catch(e) {}
    }
    
    map.on('error', (e) => { const msg = e && e.error ? e.error.message : String(e); if (/style|glyph|sprite|Failed to load|403|404|CORS|basemaps\.cartocdn/i.test(msg)) fallbackToDemo(msg); });
    setTimeout(() => { if (!map.isStyleLoaded()) fallbackToDemo('timeout'); }, 8000);
    map.on('movestart', () => { if (activationTimer) clearTimeout(activationTimer); });
    map.on('zoom', onZoomTerrain);
    map.on('moveend', updateTerrain);
    map.on('sourcedata', onDataTerrain);
    map.on('load', () => { map.resize(); applyProjection(); });
    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'bottom-right');
    
    function satStyleObj() {
      return { version: 8, projection: getTerrainProjection(), sources: { 'sat-imagery': { type: 'raster', tiles: [ESRI_URL], tileSize: 256 }, 'sat-labels': { type: 'raster', tiles: ['https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}'], tileSize: 256 } }, sky: { 'sky-color': '#7fb2e8', 'horizon-color': '#d8e8ff', 'fog-color': '#c8d8f0', 'fog-ground-blend': 0.6, 'horizon-fog-blend': 0.5, 'sky-horizon-blend': 0.5, 'atmosphere-blend': 0.6 }, light: { anchor: 'map', color: '#ffffff', intensity: 0.55, position: [1.5, 90, 80] }, layers: [ { id: 'background', type: 'background', paint: { 'background-color': '#020408' } }, { id: 'sat-base', type: 'raster', source: 'sat-imagery' }, { id: 'sat-ref', type: 'raster', source: 'sat-labels' } ] };
    }
    
    function setStyleDark() { styleFallbackDone = false; currentStyle = 'dark'; document.getElementById('btn-map').classList.add('active'); document.getElementById('btn-sat').classList.remove('active'); terrainActive = false; map.setStyle(DARK_STYLE_URL); map.once('style.load', () => applyProjection()); }
    function setStyleSat() { currentStyle = 'satellite'; document.getElementById('btn-sat').classList.add('active'); document.getElementById('btn-map').classList.remove('active'); terrainActive = false; map.setStyle(satStyleObj()); map.once('style.load', () => applyProjection()); }
    function set3D() { currentProjectionMode = 'globe'; document.getElementById('btn-3d').classList.add('active'); document.getElementById('btn-2d').classList.remove('active'); applyProjection(); map.easeTo({ pitch: 0, bearing: 0, duration: 1000 }); }
    function set2D() { currentProjectionMode = 'mercator'; document.getElementById('btn-2d').classList.add('active'); document.getElementById('btn-3d').classList.remove('active'); applyProjection(); map.easeTo({ pitch: 0, bearing: 0, duration: 1000 }); }
    
    document.getElementById('btn-map').onclick = setStyleDark;
    document.getElementById('btn-sat').onclick = setStyleSat;
    document.getElementById('btn-3d').onclick = set3D;
    document.getElementById('btn-2d').onclick = set2D;
    
    document.getElementById('btn-relieve').onclick = (ev) => {
      terrainEnabled = !terrainEnabled; ev.target.classList.toggle('active', terrainEnabled);
      applyProjection();
      if (terrainEnabled) {
        if (map.getZoom() < 10) { document.getElementById('terrain-status').textContent = 'acerca a zoom >=10'; if (allUnits.length > 0) { const u = allUnits[0]; map.flyTo({ center: [u.lon, u.lat], zoom: 12, pitch: 60, duration: 1600 }); } }
        else { map.easeTo({ pitch: 60, bearing: -12, duration: 1000 }); }
      } else { releaseTerrain(); setTerrainStatus('idle'); map.easeTo({ pitch: 0, duration: 800 }); }
    };
    document.getElementById('btn-mexico').onclick = () => { map.flyTo({ center: [-102.5, 23.6], zoom: 5, pitch: 0, duration: 1400 }); };
    let spinning = false;
    document.getElementById('btn-spin').onclick = (ev) => { spinning = !spinning; ev.target.classList.toggle('active', spinning); if (spinning) { const spin = () => { if (!spinning) return; map.easeTo({ bearing: map.getBearing() + 0.4, duration: 100, easing: (t) => t }); setTimeout(spin, 110); }; spin(); } };
    
    const markers = {};
    let allUnits = [];
    let firstFitDone = false;
    
    // AHORA JALA DE LA MISMA FUENTE QUE FLEET.HTML (SMS + HUBBLE)
    async function loadFleet() {
      try {
        const res = await fetch('/api/posiciones/latest', { cache: 'no-store', headers: { 'x-api-key': API_KEY } });
        if (!res.ok) return;
        const data = await res.json();
        const arr = Array.isArray(data) ? data : (data.rows || []);
        
        allUnits = arr.map((u, idx) => {
          const name = u.nombre || u.device || ('Unidad ' + (idx + 1));
          const lat = parseFloat(u.lat);
          const lon = parseFloat(u.lon);
          const lastTs = u.timestamp ? new Date(u.timestamp).getTime() : 0;
          const ageMin = lastTs > 0 ? (Date.now() - lastTs) / 60000 : 9999;
          const isOnline = ageMin >= 0 && ageMin < 15;
          return { id: String(u.device_id || u.device || name), name, lat, lon, speed: u.velocidad || 0, isOnline, lastPacket: lastTs };
        }).filter(u => !isNaN(u.lat) && !isNaN(u.lon) && (u.lat !== 0 || u.lon !== 0));
        
        renderFleet();
      } catch(e) {}
    }
    
    function renderFleet() {
      const query = document.getElementById('unit-search').value.trim().toLowerCase();
      const listEl = document.getElementById('unit-list'); listEl.innerHTML = '';
      let onlineCount = 0; const bounds = new maplibregl.LngLatBounds();
      
      allUnits.forEach((u) => {
        if (u.isOnline) onlineCount++; bounds.extend([u.lon, u.lat]);
        const lastStr = u.lastPacket ? new Date(u.lastPacket).toLocaleString('es-MX') : 'sin dato';
        
        if (map && map.loaded && map.loaded() && !markers[u.id]) {
          const el = document.createElement('div'); el.style.width = '14px'; el.style.height = '14px'; el.style.borderRadius = '50%'; el.style.backgroundColor = u.isOnline ? '#22C55E' : '#F59E0B'; el.style.border = '2px solid #ffffff'; el.style.boxShadow = u.isOnline ? '0 0 12px #22C55E' : '0 0 6px rgba(0,0,0,0.9)'; el.style.cursor = 'pointer';
          markers[u.id] = new maplibregl.Marker({ element: el }).setLngLat([u.lon, u.lat]).setPopup(new maplibregl.Popup({ offset: 14 }).setHTML(`<div style="color:#0f172a;font-size:12px;line-height:1.4;"><strong>${u.name}</strong><br>Estado: <b style="color:${u.isOnline ? '#16a34a' : '#dc2626'}">${u.isOnline ? 'EN LINEA' : 'FUERA'}</b><br>Vel: ${Math.round(u.speed)} km/h<br>Ultimo: ${lastStr}</div>`)).addTo(map);
        } else if (map && map.loaded && map.loaded() && markers[u.id]) { 
          markers[u.id].setLngLat([u.lon, u.lat]); 
        }
        
        if (!query || u.name.toLowerCase().includes(query)) {
          const card = document.createElement('div'); card.className = 'unit-card'; 
          card.innerHTML = `<div><div class="unit-name">${u.name}</div><div class="unit-coords">${u.lat.toFixed(4)}, ${u.lon.toFixed(4)}</div></div><div class="${u.isOnline ? 'badge-on' : 'badge-off'}">${u.isOnline ? 'EN LINEA' : 'FUERA'}</div>`;
          card.onclick = () => { map.flyTo({ center: [u.lon, u.lat], zoom: 14, pitch: terrainEnabled ? 60 : 0, duration: 1400 }); };
          listEl.appendChild(card);
        }
      });
      
      document.getElementById('stat-total').textContent = allUnits.length;
      document.getElementById('stat-online').textContent = onlineCount;
      document.getElementById('stat-offline').textContent = allUnits.length - onlineCount;
      document.getElementById('online-label').textContent = onlineCount + ' EN LINEA';
      document.getElementById('entity-count').textContent = 'UNITS ' + allUnits.length;
      
      if (!firstFitDone && allUnits.length > 0 && map && map.loaded && map.loaded()) { firstFitDone = true; setTimeout(() => { map.fitBounds(bounds, { padding: { top: 90, bottom: 60, left: 320, right: 50 }, maxZoom: 10, duration: 1800 }); }, 800); }
    }
    
    document.getElementById('unit-search').addEventListener('input', renderFleet);
    map.on('load', () => { loadFleet(); });
    loadFleet();
    setInterval(loadFleet, 30000); // Respaldo cada 30s.
    
    }).catch(e => { console.error('[OSIRIS] MapLibre no cargó', e); });
  </script>
</body>
</html>
